---
# =============================================================================
# 기본 CLI 도구 설치
# -----------------------------------------------------------------------------
# 실행:
#   ansible-playbook -i hosts install_basic_apps.yml -K
#
# 홈 디렉터리 samba 공유는 WSL 이 아닌 타깃에서만 함께 설정된다.
# samba 비밀번호는 인벤토리의 ansible_password 를 쓰며, 없으면
# -e samba_password=... 로 넘긴다.
# =============================================================================

- name: Install basic apps
  hosts: all

  roles:
    - role: basic_apps

  tasks:
    - name: Create tmp directory
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/tmp"
        state: directory
        mode: '0755'

# WSL 타깃에서는 samba 공유를 만들지 않는다. Windows 가 이미 \\wsl$ 로 파일에
# 접근하므로 공유가 중복이고, systemd 가 꺼져 있으면 smbd 가 WSL 재시작마다
# 올라오지도 않는다.
#
# 참고: add_samba_client_share.yml 은 이름과 달리 SMB 서버를 설치하고
# /home/<user> 를 공유하며, samba_password(기본값은 인벤토리의 ansible_password)
# 를 요구하는 assert 가 있다. 둘 다 없는 타깃에서는 여기서 실패한다.
- import_playbook: playbooks/linux/samba/add_samba_client_share.yml
  when: not (is_wsl | bool)
