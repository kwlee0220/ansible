---
- name: install necessary softwares for MDT platform
  hosts: all
  vars_files:
    - vars/mdt_vars.yml

  pre_tasks:
    - name: Install psutil via apt (Ubuntu 22.04+)
      apt:
        name: python3-psutil
      become: true

  roles:
    # WSL2(및 WSL1) 에서는 PostgreSQL 관련 role 을 돌리지 않는다.
    # is_wsl 는 group_vars/all.yml 에서 ansible_kernel 로 판별한다
    # (install_development.yml 과 동일한 방식).
    - name: Install PostgreSQL
      role: postgresql
      vars:
        postgres_version: 18
      when: (install_postgresql | default(true) | bool) and not (is_wsl | bool)

    - name: Create PostgreSQL user for MDTPlatform internal data
      role: postgresql_user
      vars:
        postgres_user: "{{ mdt_postgres_user }}"
        postgres_password: "{{ mdt_postgres_password }}"
      when: (install_postgresql | default(true) | bool) and not (is_wsl | bool)

    - name: Create PostgreSQL database for MDTPlatform internal data
      role: postgresql_db
      vars:
        postgres_db: "{{ mdt_postgres_db }}"
        postgres_user: "{{ mdt_postgres_user }}"
        postgres_password: "{{ mdt_postgres_password }}"
      when: (install_postgresql | default(true) | bool) and not (is_wsl | bool)

    - name: Create PostgreSQL database for sample models
      role: postgresql_db
      vars:
        postgres_db: mdt_app
        postgres_user: "mdt"
      when: (install_postgresql | default(true) | bool) and not (is_wsl | bool)

    - name: Install pgAdmin4
      role: pgadmin4
      when: (install_postgresql | default(true) | bool) and not (is_wsl | bool)

    - name: Install Mosquitto
      role: mosquitto
      when: install_mosquitto | default(true) | bool

    - name: Install Yarn
      role: yarn
      when: install_nodejs | default(true) | bool

  tasks:
    - name: Create mdt-related directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ mdt_home_dir }}"
        - "{{ src_root_dir }}"

    - name: Create MDT environment file
      template:
        src: files/_mdtrc.j2
        dest: "{{ mdt_home_dir }}/.mdtrc"
        
    - name: Configure MDT in bashrc
      blockinfile:
        path: "{{ user_home_dir }}/.bashrc"
        prepend_newline: yes
        append_newline: yes
        insertbefore: "#THIS MUST BE AT THE END OF THE FILE"
        marker: "# MDT: {mark}"
        block: |
          [ -f {{ mdt_home_dir }}/mdt/.mdtrc ] && source {{ mdt_home_dir }}/mdt/.mdtrc
