---
# =============================================================================
# NVIDIA Isaac Sim 설치 playbook (Ubuntu 22.04 + ROS 2 Humble 연동)
# -----------------------------------------------------------------------------
# ROS 2 자체는 설치하지 않는다. 먼저 install_rdfp_infra.yml 로 ros2 role 을
# 적용해 /opt/ros/humble 이 준비된 상태여야 한다.
#
# 실행:
#   ansible-playbook -i hosts_local playbooks/rdfp/install_isaac_sim.yml -K
#
# 자주 쓰는 덮어쓰기:
#   -e isaac_sim_version=6.0.1 -e isaac_sim_zip_checksum=""
#   -e isaac_sim_build_ros_workspace=false   # 워크스페이스 빌드 생략
#   -e isaac_sim_ros_domain_id=7             # rdfp 와 도메인을 맞출 때
# =============================================================================

- name: Install NVIDIA Isaac Sim and wire it up with ROS 2
  hosts: all

  roles:
    - name: Install Isaac Sim
      role: isaac_sim
