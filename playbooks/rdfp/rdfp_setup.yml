---
# =============================================================================
# rdfp — [runtime] 시스템 런타임 의존성 + pip 전용 의존성 설치 playbook
# -----------------------------------------------------------------------------
# rdfp 데이터셋 파이프라인 실행에 필요한 시스템 라이브러리(apt)와
# Python 패키지(pip)를 설치한다. ROS 2 / MoveIt 기본 설치는 ros2 role 및
# ros_moveit role 에서 담당하므로 여기에는 포함하지 않는다.
#
# 실행:
#   ansible-playbook -i inventory.ini playbooks/rdfp/rdfp_setup.yml -K
# =============================================================================

- name: Install rdfp runtime dependencies
  hosts: all
  become: true

  tasks:
    # ---------------------------------------------------------------------
    # [runtime] 시스템 런타임 의존성 + pip 전용 의존성
    # ---------------------------------------------------------------------
    - name: Install system runtime dependencies
      ansible.builtin.apt:
        name:
          - python3-pip           # pip 설치 전제
          - ffmpeg                # recorder MP4 sink
          - python3-opencv        # camera / dataset
          - python3-yaml
          - libturbojpeg0-dev     # PyTurboJPEG 런타임 라이브러리
        state: present
        update_cache: true
      tags: [runtime]

    - name: Install pip-only Python dependencies
      ansible.builtin.pip:
        name:
          - mcap
          - mcap-ros2-support
          - "pydantic>=2"
          - "psycopg[binary]>=3"
          - PyTurboJPEG
        state: present
        executable: pip3
      tags: [runtime]
