---
# ROS2 환경설정 및 bashrc 설정

# 환경변수는 .bashrc 에 직접 쓰지 않고 별도 파일로 분리한다. MDT 플랫폼의
# .mdtrc 와 같은 방식이며, .bashrc 에는 source 한 줄만 남는다.
- name: Create ROS 2 environment file
  ansible.builtin.template:
    src: _ros2rc.j2
    dest: "{{ user_home_dir }}/.ros2rc"
    mode: '0644'
  become: false

# insertbefore 앵커는 SDKMAN 이 .bashrc 끝에 추가하는 줄이다. 앵커가 없으면
# blockinfile 이 파일 끝에 삽입하므로 SDKMAN 미설치 호스트에서도 동작한다.
- name: Configure ROS 2 in bashrc
  ansible.builtin.blockinfile:
    path: "{{ user_home_dir }}/.bashrc"
    prepend_newline: true
    append_newline: true
    insertbefore: "#THIS MUST BE AT THE END OF THE FILE"
    marker: "# ROS2: {mark}"
    block: |
      source $HOME/.ros2rc
  become: false
