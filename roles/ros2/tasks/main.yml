---
# ROS2 설치를 위한 tasks

# 운영체제 의존성 검사: ROS 2 배포판은 특정 Ubuntu 버전에만 apt 로 설치할 수 있다.
# (humble -> Ubuntu 22.04 jammy, jazzy -> Ubuntu 24.04 noble)
# 검사를 통과하지 못하면 apt 가 엉뚱한 저장소를 바라보며 실패하기 전에 중단시킨다.
- name: Verify OS dependency for ROS 2
  when: ros2_os_check | bool
  block:
    - name: Assert that facts are available
      ansible.builtin.assert:
        that:
          - ansible_distribution is defined
          - ansible_distribution_version is defined
          - ansible_distribution_release is defined
        fail_msg: >-
          운영체제 정보를 확인할 수 없습니다. 이 role 은 fact 수집이 필요하므로
          play 에 gather_facts: true 를 설정하세요.
        quiet: true

    - name: Assert that the target OS is Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
        fail_msg: >-
          이 role 은 Ubuntu 전용입니다. 현재 타깃은
          '{{ ansible_distribution }} {{ ansible_distribution_version }}' 입니다.
          Ubuntu 파생 배포판에 강제로 설치하려면 ros2_os_check=false 로 실행하세요.
        quiet: true

    - name: Assert that the ROS 2 distro is supported by this role
      ansible.builtin.assert:
        that:
          - ros2_distro in _ros2_supported_ubuntu
        fail_msg: >-
          지원하지 않는 ROS 2 배포판입니다: '{{ ros2_distro }}'.
          지원 목록: {{ _ros2_supported_ubuntu.keys() | list | join(', ') }}.
          Ubuntu {{ ansible_distribution_version }}({{ ansible_distribution_release }})
          용 배포판을 추가하려면 roles/ros2/vars/main.yml 의 _ros2_supported_ubuntu 와
          _ros2_distro_by_ubuntu 를 갱신하세요.
        quiet: true

    - name: Assert that the Ubuntu version matches the ROS 2 distro
      ansible.builtin.assert:
        that:
          - ansible_distribution_version == _ros2_supported_ubuntu[ros2_distro].version
          - ansible_distribution_release == _ros2_supported_ubuntu[ros2_distro].release
        fail_msg: >-
          ROS 2 '{{ ros2_distro }}' 는 Ubuntu {{ _ros2_supported_ubuntu[ros2_distro].version }}
          ({{ _ros2_supported_ubuntu[ros2_distro].release }}) 에서만 apt 로 설치할 수 있습니다.
          현재 타깃은 Ubuntu {{ ansible_distribution_version }}
          ({{ ansible_distribution_release }}) 입니다.
        quiet: true

- name: Load distro-specific variables
  include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ros2_distro }}.yml"
      skip: true

- name: Install locales package
  package:
    name: locales
    state: present
    update_cache: yes
  become: true

- name: Generate en_US.UTF-8 locale
  community.general.locale_gen:
    name: en_US.UTF-8
    state: present
  become: true

- name: Ensure that the Ubuntu Universe repository is enabled.
  package:
    name:
      - software-properties-common
      - curl
      - gnupg2
      - lsb-release
      - ca-certificates
      - build-essential
    state: present
    update_cache: yes
  become: true

- name: Enable Universe repository
  ansible.builtin.apt_repository:
    repo: "deb http://archive.ubuntu.com/ubuntu {{ ansible_distribution_release }} universe"
    state: present
  become: true

- name: ROS 2 GPG 키 등록
  ansible.builtin.shell: |
    mkdir -p /etc/apt/keyrings
    curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key | tee /etc/apt/keyrings/ros-archive-keyring.gpg > /dev/null
  args:
    creates: /etc/apt/keyrings/ros-archive-keyring.gpg
  become: true

- name: ROS 2 저장소 라인 추가
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu {{ ansible_distribution_release }} main"
    state: present
    filename: ros2
    update_cache: yes
  become: true

- name: Install ROS2 Python dependencies
  package:
    name: "{{ ros2_python_packages }}"
    state: present
  become: true

# ros2_packages / ros2_packages_extra 는 접두어 없는 이름으로 관리하므로
# 설치 직전에 "ros-<distro>-" 를 붙여 실제 패키지 이름을 만든다.
- name: "Install ROS 2 {{ ros2_distro }} packages"
  package:
    name: >-
      {{ ros2_packages_unversioned
         + ((ros2_packages + ros2_packages_extra)
            | map('regex_replace', '^', ros2_pkg_prefix) | list) }}
    state: present
  become: true

- name: Initialize rosdep
  ansible.builtin.command: rosdep init
  args:
    creates: /etc/ros/rosdep/sources.list.d/20-default.list
  become: true

- name: Update rosdep
  ansible.builtin.command: rosdep update
  become: false
  changed_when: false
