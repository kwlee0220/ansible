---
vscode_gpg_url: https://packages.microsoft.com/keys/microsoft.asc

# Map the host CPU architecture to the Debian arch name used by the VS Code repo.
vscode_arch_map:
  x86_64: amd64
  aarch64: arm64
  armv7l: armhf
vscode_deb_arch: "{{ vscode_arch_map[ansible_architecture] | default('amd64') }}"

vscode_repo: "deb [arch={{ vscode_deb_arch }} signed-by=/etc/apt/keyrings/microsoft.asc] https://packages.microsoft.com/repos/vscode stable main"
