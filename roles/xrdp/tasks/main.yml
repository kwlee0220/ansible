---
# X 서버를 매 실행 최신으로 끌어올리면 GUI 호스트가 예기치 않게 바뀔 수 있어 present 를 쓴다.
- name: xrdp 및 dependent 모듈 설치
  become: true
  package:
    name:
      - xserver-xorg-core
      - xserver-xorg-input-all
      - xrdp
    state: present

- name: 적용할 xrdp 포트 결정 (WSL2에서 기본값이면 3390 사용)
  set_fact:
    xrdp_effective_port: "{{ 3390 if (is_wsl | bool and xrdp_port == 3389) else xrdp_port }}"

# xrdp.ini 에는 'port=' 로 시작하는 줄이 여럿 있다 (port=-1, port=ask3389 등).
# lineinfile 은 마지막 매칭을 바꾸므로 [Globals] 의 숫자 포트만 정확히 잡도록 '^port=[0-9]+$' 를 쓴다.
# 값이 바뀐 뒤에도 이 정규식은 자기 자신을 다시 매칭하므로 포트를 재변경해도 동작한다.
- name: xrdp 포트 번호 설정
  become: true
  lineinfile:
    dest: /etc/xrdp/xrdp.ini
    regexp: '^port=[0-9]+$'
    line: "port={{ xrdp_effective_port }}"
    state: present
  notify: restart xrdp

- name: xrdp에 SSL 인증서 접근 권한 추가
  become: true
  user: name=xrdp group=xrdp groups=ssl-cert append=yes
  notify: restart xrdp

- name: xrdp 설정 변경 (접속시 검은 화면만 보이는 문제 해결)
  become: true
  lineinfile:
    dest: /etc/xrdp/startwm.sh
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  with_items:
    - regexp: "^unset DBUS_SESS"
      line: "unset DBUS_SESSION_BUS_ADDRESS"
    - regexp: "^unset XDG_RUNTIME"
      line: "unset XDG_RUNTIME_DIR"
  notify: restart xrdp

- name: Enable Wayland by uncommenting WaylandEnable in /etc/gdm3/custom.conf (접속시 검은 화면만 보이는 문제 해결)
  become: true
  lineinfile:
    path: /etc/gdm3/custom.conf
    regexp: '^#WaylandEnable=false'
    line: 'WaylandEnable=false'
    state: present

- name: 현재 기본 부팅 타겟 확인
  become: true
  command: systemctl get-default
  register: xrdp_default_target
  changed_when: false
  check_mode: false

- name: Login 과정에서 password 입력 후 멈추는 문제 해결 (기본 부팅 타겟을 graphical로)
  become: true
  command: systemctl set-default graphical.target
  when: xrdp_default_target.stdout | trim != 'graphical.target'

# 실행 중인 시스템을 즉시 graphical로 전환한다. 디스플레이 매니저가 재시작되면서
# 접속 중인 세션(RDP/콘솔)이 끊기므로 기본값은 false이고, 평소에는 재부팅으로 반영된다.
- name: graphical 타겟으로 즉시 전환 (xrdp_isolate_graphical_now=true 인 경우에만)
  become: true
  command: systemctl isolate graphical.target
  when:
    - xrdp_isolate_graphical_now | bool
    - xrdp_default_target.stdout | trim != 'graphical.target'

# Ubuntu 24.04의 polkit 124는 .pkla(local authority) 형식을 기본 지원하지 않는다.
# 호환 패키지가 없으면 아래 두 파일이 조용히 무시된다. 22.04의 polkit 0.105는 네이티브 지원.
- name: polkit .pkla 호환 패키지 설치 (Ubuntu 24.04 이상)
  become: true
  package: name=polkitd-pkla state=present
  when:
    - ansible_distribution == 'Ubuntu'
    - ansible_distribution_version is version('24.04', '>=')

- name: Create polkit directory
  file:
    path: /etc/polkit-1/localauthority/50-local.d
    state: directory
    mode: '0755'
  become: true

- name: xrdp 접속 중 Password를 지속적으로 물어보는 현상 해결 (1/2)
  become: true
  copy:
    dest: /etc/polkit-1/localauthority/50-local.d/color.pkla
    content: |
      [Allow colord for all users]
      Identity=unix-user:*
      Action=org.freedesktop.color-manager.create-device;org.freedesktop.color-manager.create-profile;org.freedesktop.color-manager.delete-device;org.freedesktop.color-manager.delete-profile;org.freedesktop.color-manager.modify-device;org.freedesktop.color-manager.modify-profile
      ResultAny=yes
      ResultInactive=yes
      ResultActive=yes
    mode: '0644'
  notify: restart xrdp

# .pkla 는 localauthority 바로 아래가 아니라 그 안의 *.d 디렉터리에서만 읽힌다
# (pkla-check-authorization(8): "read from all directories located inside").
# 예전에는 localauthority/45-allow-colord.pkla 에 두어 이 규칙 전체가 무시되고 있었다.
- name: xrdp 접속 중 Password를 지속적으로 물어보는 현상 해결 (2/2)
  become: true
  copy:
    dest: /etc/polkit-1/localauthority/50-local.d/45-allow-colord.pkla
    content: |
      [Allow Colord all Users]
      Identity=unix-user:*
      Action=org.freedesktop.color-manager.create-device;org.freedesktop.color-manager.create-profile;org.freedesktop.color-manager.delete-device;org.freedesktop.color-manager.delete-profile;org.freedesktop.color-manager.modify-device;org.freedesktop.color-manager.modify-profile
      ResultAny=no
      ResultInactive=no
      ResultActive=yes

      [Allow Package Management all Users]
      Identity=unix-user:*
      Action=org.debian.apt.*;io.snapcraft.*;org.freedesktop.packagekit.*;com.ubuntu.update-notifier.*
      ResultAny=no
      ResultInactive=no
      ResultActive=yes
    mode: '0644'
  notify: restart xrdp

- name: xsessionrc 파일 생성
  copy:
    dest: "{{ user_home_dir }}/.xsessionrc"
    content: |
      export GNOME_SHELL_SESSION_MODE=ubuntu
      export XDG_CURRENT_DESKTOP=ubuntu:GNOME
      export XDG_CONFIG_DIRS=/etc/xdg/xdg-ubuntu:/etc/xdg
      export XDG_DATA_DIRS=/usr/share/ubuntu:/usr/local/share:/usr/share:/var/lib/snapd/desktop
      export WAYLAND_DISPLAY=
    mode: '0644'
  notify: restart xrdp
