---
user_home_dir: "{{ ansible_env.HOME }}"

# Snap Store 의 desktop entry id 는 22.04 와 24.04 가 다르다.
#   22.04: snap-store_ubuntu-software.desktop
#   24.04: snap-store_snap-store.desktop  (App Center)
# 존재하지 않는 id 를 favorites 에 넣으면 독에 빈 칸으로 남는다.
snap_store_desktop_id: >-
  {{ 'snap-store_snap-store.desktop'
  if ansible_distribution_version is version('24.04', '>=')
  else 'snap-store_ubuntu-software.desktop' }}

gnome_favorite_apps:
  - google-chrome.desktop
  - eclipse.desktop
  - cursor.desktop
  - code.desktop
  - com.gexperts.Tilix.desktop
  - org.gnome.Terminal.desktop
  - pcmanfm.desktop
  - "{{ snap_store_desktop_id }}"
  - gnome-control-center.desktop
