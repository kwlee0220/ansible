---
# nvidia_driver role 기본 변수
#
# Ubuntu 공식 저장소(restricted)의 NVIDIA 드라이버를 원하는 브랜치로 올린다.
# PPA(graphics-drivers)나 NVIDIA .run 설치 파일은 쓰지 않는다.
# Secure Boot 가 켜진 상태에서 서명 문제 없이 올릴 수 있는 유일한 경로이기 때문이다.
#   - 저장소 경로  : linux-modules-nvidia-* = Canonical 이 서명한 사전 빌드 모듈
#   - DKMS / .run  : 로컬에서 빌드 -> 서명 없음 -> Secure Boot 에서 로드 거부.
#                    MOK 키를 직접 만들어 등록(재부팅 시 파란 화면에서 수동 조작)해야 한다.

# 설치할 드라이버 브랜치 번호.
# Isaac Sim 6.0.x 는 595.58.03 이상을 요구하므로 595 이상이어야 한다.
nvidia_driver_branch: "595"

# open GPU kernel module 변형(nvidia-driver-<branch>-open)을 쓸지 여부.
# Turing 이후 GPU 에서만 동작하고, ubuntu-drivers 는 이쪽을 recommended 로 표시한다.
# 이미 proprietary 를 쓰고 있다면 변수를 늘리지 않도록 false 로 두는 편이 안전하다.
nvidia_driver_open: false

# 사전 빌드된 서명 커널 모듈(linux-modules-nvidia-*)을 함께 설치할지 여부.
# false 로 두면 nvidia-driver-<branch> 메타패키지가 nvidia-dkms-<branch> 를 끌어온다.
# Secure Boot 가 켜져 있다면 반드시 true 여야 한다.
nvidia_driver_use_prebuilt_modules: true

# 설치 시뮬레이션 결과에 nvidia-dkms 가 섞여 있으면 실패시킨다.
# (Secure Boot 환경에서 부팅 후 모듈이 안 올라오는 사고를 미리 막는다.)
nvidia_driver_assert_no_dkms: true

# 설치 전 검사
nvidia_driver_os_check: true
nvidia_driver_gpu_check: true

# 요구 최소 버전. 비워두면 버전 검사를 하지 않고 브랜치만 맞춘다.
# Isaac Sim 연동이 목적이라면 "595.58.03" 을 넘긴다.
nvidia_driver_min_version: ""

# 교체 후 남는 구 브랜치 잔여 패키지 정리
nvidia_driver_autoremove: true

# 드라이버 교체는 재부팅해야 적용된다.
# true 로 두면 role 이 직접 재부팅한다(원격 대상일 때 편하다).
# false 면 재부팅이 필요하다는 사실만 알리고 끝낸다.
nvidia_driver_reboot: false
nvidia_driver_reboot_timeout: 600

# PRIME 모드. 빈 문자열이면 건드리지 않는다.
#   nvidia    : NVIDIA GPU 가 화면까지 담당 (Omniverse/Isaac Sim 권장)
#   on-demand : 내장 GPU 가 화면, 요청한 앱만 NVIDIA (Kit 앱이 GPU 를 못 잡는 경우가 있다)
#   intel     : NVIDIA 끔
nvidia_driver_prime_mode: ""
