---
# Intel 내장 GPU 와 함께 있는 하이브리드 구성에서 어느 GPU 가 화면을 담당할지 정한다.
# on-demand 모드에서는 Omniverse Kit(Isaac Sim) 이 NVIDIA GPU 를 잡지 못하는 경우가 있어
# nvidia 모드로 고정하는 편이 확실하다. 모드 변경은 재부팅해야 적용된다.

- name: Assert that the requested PRIME mode is valid
  ansible.builtin.assert:
    that:
      - nvidia_driver_prime_mode in _nvidia_driver_prime_modes
    fail_msg: >-
      nvidia_driver_prime_mode 는 {{ _nvidia_driver_prime_modes | join(' / ') }}
      중 하나여야 합니다 (받은 값: '{{ nvidia_driver_prime_mode }}').
    quiet: true

- name: Install nvidia-prime
  ansible.builtin.apt:
    name: nvidia-prime
    state: present
  become: true

- name: Query the current PRIME mode
  ansible.builtin.command: prime-select query
  register: nvidia_driver_prime_query
  changed_when: false
  check_mode: false
  failed_when: false
  environment: "{{ _nvidia_driver_c_locale }}"

# prime-select 는 하이브리드(내장 GPU + NVIDIA) 구성이 아니면 실패한다.
# 그 상태로 전환을 시도하면 알아보기 어려운 에러가 나므로 먼저 걸러낸다.
- name: Assert that prime-select works on this machine
  ansible.builtin.assert:
    that:
      - nvidia_driver_prime_query.rc == 0
    fail_msg: >-
      prime-select 조회에 실패했습니다
      ('{{ nvidia_driver_prime_query.stderr | default('', true) | trim }}').
      하이브리드 그래픽 구성이 아닐 수 있습니다. PRIME 설정을 건너뛰려면
      nvidia_driver_prime_mode 를 비워두고 실행하세요.
    quiet: true

- name: Switch the PRIME mode
  ansible.builtin.command: "prime-select {{ nvidia_driver_prime_mode }}"
  become: true
  when: nvidia_driver_prime_query.stdout | trim != nvidia_driver_prime_mode
  register: nvidia_driver_prime_switch
  changed_when: nvidia_driver_prime_switch.rc == 0

- name: Report the PRIME mode change
  ansible.builtin.debug:
    msg: >-
      PRIME 모드를 '{{ nvidia_driver_prime_query.stdout | trim }}' 에서
      '{{ nvidia_driver_prime_mode }}' 로 바꿨다. 재부팅해야 적용된다.
  when: nvidia_driver_prime_switch is changed
