---
# include_tasks 는 동적 include 라 태그가 자식 태스크로 전파되지 않는다.
# apply 를 쓰지 않으면 `--tags install` 같은 부분 실행에서 include 만 돌고
# 안의 태스크는 전부 걸러져 "아무 일도 일어나지 않는" 상태가 된다.
#
# detect 는 always 로 둔다. 여기서 정하는 _nvidia_driver_kernel_flavour 가
# 모듈 패키지 이름을 조립하는 데 쓰이므로, 어느 태그로 실행하든 먼저 돌아야 한다.
- name: Detect kernel flavour / Secure Boot / current driver
  ansible.builtin.include_tasks:
    file: detect.yml
    apply:
      tags: [always]
  tags: [always]

- name: Validate the requested driver branch
  ansible.builtin.include_tasks:
    file: validate.yml
    apply:
      tags: [nvidia_driver, validate]
  tags: [nvidia_driver, validate]

# PRIME 은 설치보다 먼저 한다. prime-select 는 설정 파일만 쓰므로 새 드라이버가
# 필요 없고, install 이 재부팅까지 하는 경우 그 재부팅 한 번으로 둘 다 적용된다.
# (순서를 뒤집으면 재부팅 뒤에 모드가 바뀌어 재부팅이 한 번 더 필요해진다.)
- name: Configure the PRIME mode
  ansible.builtin.include_tasks:
    file: prime.yml
    apply:
      tags: [nvidia_driver, prime]
  when: nvidia_driver_prime_mode | length > 0
  tags: [nvidia_driver, prime]

- name: Install the NVIDIA driver
  ansible.builtin.include_tasks:
    file: install.yml
    apply:
      tags: [nvidia_driver, install]
  tags: [nvidia_driver, install]
