---
- name: Install ibus-hangul and required packages
  package:
    name:
      - ibus
      - ibus-hangul
    state: present
  become: true

- name: Start ibus daemon
  shell: |
    ibus-daemon -drx
  args:
    executable: /bin/bash
  become: false

- name: Set Korean locale
  lineinfile:
    path: /etc/default/locale
    regexp: '^LANG='
    line: 'LANG=ko_KR.UTF-8'
    state: present
  become: true

- name: Set ibus as the default input method
  shell: |
    im-config -n ibus
  args:
    executable: /bin/bash
  become: false

# gsettings 는 D-Bus 세션 버스 없이는 쓰기가 조용히 무시된다 (ubuntu_desktop 롤과 동일한 이유).
- name: Add Korean input source for ibus
  shell: dbus-run-session -- bash -s
  args:
    executable: /bin/bash
    stdin: |
      gsettings set org.gnome.desktop.input-sources sources "[('ibus', 'hangul')]"
  become: false
