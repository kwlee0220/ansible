---
- name: Install ibus-hangul and required packages
  package:
    name:
      - ibus
      - ibus-hangul
    state: present
  become: true

# -x 는 XIM 서버를 띄우므로 DISPLAY 가 필요하다. SSH 세션에는 DISPLAY 가 없어
# 실행하면 실패하고, 어차피 데스크톱 로그인 시 세션이 ibus 를 자동 기동하므로
# 그래픽 세션이 있을 때만 시도한다.
- name: Start ibus daemon
  shell: |
    ibus-daemon -drx
  args:
    executable: /bin/bash
  become: false
  when: ansible_env.DISPLAY is defined

- name: Set Korean locale
  lineinfile:
    path: /etc/default/locale
    regexp: '^LANG='
    line: 'LANG=ko_KR.UTF-8'
    state: present
  become: true

- name: Set ibus as the default input method
  shell: |
    im-config -n ibus
  args:
    executable: /bin/bash
  become: false

# gsettings 는 D-Bus 세션 버스 없이는 쓰기가 조용히 무시된다
# (install_gui.yml 의 'Set desktop interface settings' 와 동일한 이유).
- name: Add Korean input source for ibus
  shell: dbus-run-session -- bash -s
  args:
    executable: /bin/bash
    stdin: |
      gsettings set org.gnome.desktop.input-sources sources "[('ibus', 'hangul')]"
  become: false
