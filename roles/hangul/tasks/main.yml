---

- name: Install Korean language pack and fonts
  package:
    name:
      - language-pack-ko
      - fonts-nanum
      - fonts-noto-cjk
    state: present
  become: true
  
- name: Install locales and configure UTF-8
  block:
  - name: install locale
    become: true
    apt: name=locales state=present

  - name: generate ko_KR.UTF-8 locale
    become: true
    community.general.locale_gen:
      name: ko_KR.UTF-8
      state: present

  - name: set ko_KR.UTF-8 as the system locale
    become: true
    lineinfile:
      path: /etc/default/locale
      regexp: '^LANG='
      line: 'LANG=ko_KR.UTF-8'
      create: yes

  # LC_ALL 은 모든 LC_* 를 강제로 덮어써서 사용자가 개별 카테고리를 조정할 수 없게
  # 만든다. 예전 실행이 남긴 값이 있으면 걷어내고 LANG 만 남긴다.
  - name: drop the LC_ALL override left by earlier runs
    become: true
    lineinfile:
      path: /etc/default/locale
      regexp: '^LC_ALL='
      state: absent

  - name: insert 'LANG=ko_KR.UTF-8' to .bashrc
    lineinfile:
      path: "{{ user_home_dir }}/.bashrc"
      line: "export LANG=ko_KR.UTF-8"
      insertafter: '# Copied from Ansible'
      
- name: Install Hangul for Ubuntu
  include_tasks: "ubuntu.yml"
  when: not (is_wsl | bool)

- name: Install Hangul for WSL2
  include_tasks: "wsl2.yml"
  when: is_wsl | bool