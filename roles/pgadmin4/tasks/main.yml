---
# force: a leftover /tmp copy from an aborted run would otherwise be reused
# forever, since get_url skips the download when the destination exists.
- name: Download pgAdmin GPG key
  ansible.builtin.get_url:
    url: https://www.pgadmin.org/static/packages_pgadmin_org.pub
    dest: /tmp/packages_pgadmin_org.pub
    mode: '0644'
    force: yes
  become: yes

# Dearmor into a temporary file first: writing straight to the keyring would
# leave an empty file behind if gpg rejects the download, and gpg's exit code
# must not be masked by a trailing command.
- name: Convert pgAdmin GPG key to keyring format
  ansible.builtin.command:
    cmd: >-
      gpg --batch --yes --dearmor
      --output /tmp/packages-pgadmin-org.gpg
      /tmp/packages_pgadmin_org.pub
  changed_when: false
  become: yes

- name: Install pgAdmin keyring
  ansible.builtin.copy:
    src: /tmp/packages-pgadmin-org.gpg
    dest: /usr/share/keyrings/packages-pgadmin-org.gpg
    remote_src: yes
    mode: '0644'
    owner: root
    group: root
  become: yes

- name: Remove temporary GPG key files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/packages_pgadmin_org.pub
    - /tmp/packages-pgadmin-org.gpg
  become: yes

- name: Add pgAdmin repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/packages-pgadmin-org.gpg] https://ftp.postgresql.org/pub/pgadmin/pgadmin4/apt/{{ ansible_distribution_release }} pgadmin4 main"
    state: present
    filename: pgadmin4
  become: yes

- name: Install required dependencies
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-setuptools
      - python3-wheel
    state: present
    update_cache: yes
  become: yes

- name: Install pgAdmin4
  ansible.builtin.apt:
    name: pgadmin4
    state: present
    update_cache: yes
  become: yes

- name: Create pgAdmin4 config directory
  ansible.builtin.file:
    path: "/var/lib/pgadmin"
    state: directory
    mode: '0750'
  become: yes

# The setup credentials never become readable to non-root users: the script is
# mode 0700 under /root rather than world-readable under /tmp, no_log keeps the
# rendered password out of the logs, and passing it via the environment is
# avoided because Ansible would expose it in the remote process command line.
# Removal sits in `always` so an aborted setup cannot leave the file behind.
- name: Configure pgAdmin4 web mode
  become: yes
  block:
    - name: Create setup script
      ansible.builtin.copy:
        dest: /root/.pgadmin4_setup.sh
        mode: '0700'
        owner: root
        group: root
        content: |
          #!/bin/bash
          export PGADMIN_SETUP_EMAIL="{{ pgadmin4_email }}"
          export PGADMIN_SETUP_PASSWORD="{{ pgadmin4_password }}"
          /usr/pgadmin4/bin/setup-web.sh --yes
      no_log: true

    - name: Run pgAdmin4 setup script
      ansible.builtin.command:
        cmd: /root/.pgadmin4_setup.sh
        creates: /var/lib/pgadmin/pgadmin4.db
  always:
    - name: Remove setup script
      ansible.builtin.file:
        path: /root/.pgadmin4_setup.sh
        state: absent