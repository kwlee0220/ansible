---
- name: Install required packages for pyenv on Ubuntu
  ansible.builtin.apt:
    name:
      - git
      - curl
      - ca-certificates

      # Python build deps (common)
      - build-essential
      - libssl-dev
      - zlib1g-dev
      - libbz2-dev
      - libreadline-dev
      - libsqlite3-dev
      - libffi-dev
      - liblzma-dev
      - tk-dev
      - xz-utils

      # Recommended extras (often needed by some modules)
      - llvm
      # libncursesw5-dev / libncurses5-dev 는 24.04 에서 제거되었다.
      # libncurses-dev 는 22.04, 24.04 양쪽에 모두 존재한다.
      - libncurses-dev
      - libgdbm-dev
      - libc6-dev
      - libdb-dev
      - uuid-dev
    state: present
    update_cache: yes
  become: yes
