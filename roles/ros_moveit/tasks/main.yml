---
# MoveIt2 는 소스 오버레이가 아니라 apt 바이너리로 설치한다. 소스 오버레이는
# apt 라이브러리(geometric_shapes 등) 자동 업그레이드 시 SONAME 불일치로 깨지므로
# 사용하지 않는다.
# 참고: ros2-control / ros2-controllers / tf-transformations / python3-transforms3d 는
#       의존 role 인 ros2 가 이미 설치하므로 여기서는 중복 설치하지 않는다.
- name: "Install MoveIt2 for ROS 2 {{ ros2_distro }} (apt binaries)"
  ansible.builtin.apt:
    name: "{{ ros_moveit_packages | map('regex_replace', '^', ros2_pkg_prefix) | list }}"
    state: present
  become: true

- name: Install optional MoveIt2 packages (apt 미제공 시 무시)
  ansible.builtin.apt:
    name: "{{ ros_moveit_optional_packages | map('regex_replace', '^', ros2_pkg_prefix) | list }}"
    state: present
  failed_when: false
  become: true

- name: Install ROS 2 MoveIt dependencies
  ansible.builtin.apt:
    name: "{{ ros_moveit_extra_packages | map('regex_replace', '^', ros2_pkg_prefix) | list }}"
    state: present
  become: true
