---
- name: Validate postgres_access_scope
  assert:
    that: postgres_access_scope in ['subnet', 'all']
    fail_msg: >-
      postgres_access_scope 는 'subnet' 또는 'all' 이어야 한다
      (지정된 값: {{ postgres_access_scope }}).
      특정 대역만 열려면 postgres_allow_hosts 를 직접 지정한다.
    quiet: true

- name: Remove existing PostgreSQL repository files
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /etc/apt/sources.list.d/pgdg.list
    - /etc/apt/sources.list.d/pgdg.list.list
    - /etc/apt/trusted.gpg.d/postgresql.asc
  become: true

- name: Download PostgreSQL signing key
  get_url:
    url: "{{ pgdg_gpg_url }}"
    dest: "{{ pgdg_key_path }}"
    mode: '0644'
  become: true

- name: Add PostgreSQL APT repository
  apt_repository:
    repo: "{{ pgdg_repo }}"
    state: present
    filename: "pgdg.list"
    update_cache: yes
  become: true

- name: Install PostgreSQL packages
  package:
    name: "{{ postgres_packages }}"
    update_cache: true
    state: present
  become: true

- name: Look up the port of the target PostgreSQL cluster
  #   같은 호스트에 다른 메이저 버전 클러스터가 이미 있으면 새 클러스터는 5432 가 아닌
  #   비어 있는 포트(5433 등)에 만들어진다. 이후 태스크가 엉뚱한 클러스터에 붙지 않도록
  #   실제 포트를 조회해 둔다.
  command: pg_lsclusters -h {{ postgres_version }} main
  register: pg_lsclusters_result
  changed_when: false
  become: true

- name: Set the target PostgreSQL cluster port
  set_fact:
    postgres_port: "{{ pg_lsclusters_result.stdout.split()[2] }}"

- name: Ensure PostgreSQL is listening on all addresses
  lineinfile:
    dest: /etc/postgresql/{{ postgres_version }}/main/postgresql.conf
    regexp: '^#listen_addresses\s*='
    line: "listen_addresses = '{{ postgres_listen_addresses }}'"
    state: present
  become: true

- name: Remove stale network access entries from pg_hba.conf
  #   이전 실행이 남긴 허용 대역(예: 0.0.0.0/0)을 걷어낸다. 이 줄이 남아 있으면
  #   pg_hba 는 first-match-wins 라 새로 추가한 좁은 대역이 도달하지 못한다.
  #   ::1/128 은 '[0-9]' 조건에 걸리지 않으므로 그대로 보존된다.
  lineinfile:
    dest: /etc/postgresql/{{ postgres_version }}/main/pg_hba.conf
    regexp: "^host\\s+all\\s+all\\s+(?!127\\.0\\.0\\.1/32\\s|{{ postgres_allow_hosts | regex_escape }}\\s)[0-9]"
    state: absent
  become: true

- name: Ensure the loopback entry exists in pg_hba.conf
  #   postgres_allow_hosts 를 서브넷으로 좁히면 127.0.0.1 이 어느 대역에도
  #   포함되지 않으므로, localhost TCP 접속용 줄을 항상 따로 보장한다.
  lineinfile:
    dest: /etc/postgresql/{{ postgres_version }}/main/pg_hba.conf
    regexp: '^host\s+all\s+all\s+127\.0\.0\.1/32\s'
    line: "host    all             all             127.0.0.1/32            scram-sha-256"
    insertafter: '^local\s+all\s+all'
  become: true

- name: Allow access from {{ postgres_allow_hosts }} in pg_hba.conf
  lineinfile:
    dest: /etc/postgresql/{{ postgres_version }}/main/pg_hba.conf
    regexp: "^host\\s+all\\s+all\\s+{{ postgres_allow_hosts | regex_escape }}\\s"
    line: "host    all             all             {{ postgres_allow_hosts }}               scram-sha-256"
    insertafter: '^host\s+all\s+all\s+127\.0\.0\.1/32\s'
  become: true

- name: Ensure PostgreSQL service is started
  service:
    name: postgresql
    state: restarted
    enabled: yes
  become: true

- name: Wait for PostgreSQL to accept connections
  command: pg_isready -q -p {{ postgres_port }}
  register: pg_isready_result
  until: pg_isready_result.rc == 0
  retries: 30
  delay: 2
  changed_when: false
  become: true
  become_user: postgres

- name: Create a superuser PostgreSQL database user
  community.postgresql.postgresql_user:
    name: "{{ postgres_root_user }}"
    password: "{{ postgres_root_password }}"
    role_attr_flags: CREATEDB,SUPERUSER,CREATEROLE
    encrypted: yes
    port: "{{ postgres_port }}"
    state: present
  become: true
  become_user: postgres

- name: Create a new PostgreSQL database with PostGIS extension
  shell: |
    psql -p {{ postgres_port }} -c "CREATE DATABASE {{ postgres_gis_db }};" 2>/dev/null || echo "Database already exists"
    psql -p {{ postgres_port }} -d {{ postgres_gis_db }} -c "CREATE EXTENSION postgis;" 2>/dev/null || echo "Extension already exists"
  args:
    executable: /bin/bash
  become: true
  become_user: postgres