---
# PostgreSQL 설치 관련 변수
postgres_version: 18
postgres_root_user: "postgres"
postgres_root_password: "postgres"

# PostgreSQL 저장소 설정
pgdg_gpg_url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
pgdg_repo: "deb [arch=amd64] http://apt.postgresql.org/pub/repos/apt/ {{ ansible_distribution_release }}-pgdg main"
pgdg_key_path: /etc/apt/trusted.gpg.d/postgresql.asc

# PostgreSQL 패키지 목록
#   contrib 모듈(hstore, pg_stat_statements, uuid-ossp 등)은 PostgreSQL 10 부터
#   postgresql-<version> 본체 패키지에 포함되어 있다.
#   별도의 postgresql-contrib-<version> 패키지는 9.6 이 마지막이므로 나열하지 않는다.
postgres_packages:
  - "postgresql-{{ postgres_version }}"
  - "postgresql-client-{{ postgres_version }}"
  - "postgresql-{{ postgres_version }}-postgis-3"
  - "postgresql-{{ postgres_version }}-postgis-3-scripts"
  - libpq-dev
  - python3-psycopg2

# 네트워크 설정
postgres_listen_addresses: "*"

# 접속 허용 범위
#   subnet : 서버가 속한 서브넷에서만 접속 허용 (기본값)
#   all    : 어디서나 접속 허용
postgres_access_scope: subnet

# postgres_access_scope 로부터 유도된다.
# 임의의 대역만 열려면 이 변수를 직접 지정하면 되고, 그 경우 scope 값은 무시된다.
# 어느 쪽이든 127.0.0.1/32 와 ::1/128 로컬 접속은 항상 별도로 허용된다.
postgres_allow_hosts: >-
  {{ '0.0.0.0/0' if postgres_access_scope == 'all'
  else ansible_default_ipv4.network ~ '/' ~ ansible_default_ipv4.prefix }}

# PostGIS 데이터베이스 설정
postgres_gis_db: "gisdb" 