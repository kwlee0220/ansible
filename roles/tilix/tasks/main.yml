---
- name: install dconf-cli, dconf editor
  become: true
  package:
    name:
      - dconf-cli
      - dconf-editor
    state: present

- name: Install dbus-x11
  become: true
  package: name=dbus-x11

- name: install tilix program
  become: true
  package: name=tilix state=latest

- name: Source vte.sh
  # description: "Source vte.sh to fix tilix on WSL2. 경우에 따라서는 재부팅이 필요할 수 있습니다."
  shell: source /etc/profile.d/vte-2.91.sh
  args:
    executable: /bin/bash
  when: is_wsl | bool

- name: ensure tilix configuration directory
  file: path={{ user_home_dir }}/.config/tilix state=directory
- name: copy tilix configuration
  copy: src=files/tilix.dconf dest={{ user_home_dir }}/.config/tilix/tilix.dconf

# dconf 는 D-Bus 세션 버스가 있어야 쓰기가 반영된다. SSH 비대화형 세션에 버스가
# 없으면 autolaunch 를 시도하다 DISPLAY 가 없어 실패하므로 버스를 마련해 줘야 한다.
#
# 다만 데스크톱 세션이 떠 있는 호스트에서 dbus-run-session 을 쓰면 안 된다.
# 그러면 일회용 버스에 두 번째 dconf-service 가 떠서 ~/.config/dconf/user 를
# 직접 쓰는데, 세션의 dconf-service 는 그 변경을 모른다. 이후 그 서비스가 아무
# 키나 쓰는 순간 자기 메모리 상태로 파일 전체를 다시 써서 여기서 넣은 값이
# 통째로 사라진다. 읽기는 DB 파일을 직접 보므로 덮어쓰기 전까지는 정상으로
# 보이고, 그래서 원인을 찾기 어렵다.
#
# 따라서 세션 버스가 있으면 그 버스를 쓰고, 없을 때만 dbus-run-session 으로 넘긴다.
- name: load tilix configuration
  shell: |
    bus="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/bus"
    if [ -S "$bus" ]; then
        DBUS_SESSION_BUS_ADDRESS="unix:path=$bus" \
            dconf load /com/gexperts/Tilix/ < {{ user_home_dir }}/.config/tilix/tilix.dconf
    else
        dbus-run-session -- \
            dconf load /com/gexperts/Tilix/ < {{ user_home_dir }}/.config/tilix/tilix.dconf
    fi
  args:
    executable: /bin/bash

# GNOME 의 Navigation > 'Hide all normal windows' 에 Ctrl+D 가 걸려 있으면
# 데스크톱이 먼저 가로채서 터미널로 EOF 가 전달되지 않는다.
# 빈 목록(@as [])을 넣어 단축키를 해제한다.
#   schema  : org.gnome.desktop.wm.keybindings   (50-mutter-navigation.xml)
#   key     : show-desktop  =  "Hide all normal windows"
- name: Disable the GNOME 'Hide all normal windows' shortcut (Ctrl+D 가로채기 방지)
  become: false
  dconf:
    key: "{{ gnome_show_desktop_key }}"
    value: "@as []"
    state: present

# WSLg 에서는 X11(Xwayland) 이 아니라 Wayland 백엔드로 띄운다. Xwayland 로 띄우면
# 세 가지가 한꺼번에 어긋난다:
#
#   커서    Xwayland 창 위에서 마우스 포인터가 아예 보이지 않는다. 커서 테마와는
#           무관하다 (테마가 없으면 GDK 가 X 코어 폰트 커서로 폴백하는데 그것도
#           안 보인다). Wayland 로 띄운 같은 GTK 창에서는 정상이다.
#
#   창 크기  tilix 는 헤더바를 직접 그리는 CSD 앱이라 _MOTIF_WM_HINTS 로 "장식하지
#           마라" 를 알린다. WSLg 의 weston 은 그대로 따라 창틀을 주지 않는데,
#           GTK 가 대신 만드는 CSD 리사이즈 테두리는 WM 이 _GTK_FRAME_EXTENTS 를
#           지원할 때만 생긴다. weston 의 _NET_SUPPORTED 에는 그 아톰이 없다.
#           결국 창을 잡을 데가 없어 드래그로도 최대화로도 크기가 안 바뀐다.
#           Wayland 에서는 GTK 가 리사이즈 테두리를 스스로 관리하므로 문제없다.
#
#   제목줄  위 두 가지를 X11 에서 우회하려면 window-style 을 'disable-csd' 로
#           바꿔야 하는데, 그러면 타이틀바와 tilix 툴바가 두 줄로 나뉜다.
#           Wayland 에서는 기본값 'normal' 그대로 한 줄 헤더바로 합쳐진다.
#
# 한글 입력(fcitx5)은 Wayland 에서도 GTK_IM_MODULE=fcitx 로 잘 붙는다. 단 그 경로는
# DBus 를 타므로 세션 버스가 있어야 한다 (X11 은 XIM 으로 우회되어 버스 없이도
# 되던 탓에 문제가 가려진다). dbus-user-session 참조.
#
# alias 가 아니라 셸 함수인 이유는 인자 때문이다. alias 로 두면 뒤에 붙는 인자가
# '&' 다음으로 밀려 별도 명령으로 실행되어 버린다.
#   alias tilix="... &> /dev/null &" 일 때
#   $ tilix -w /some/dir  ->  ... &> /dev/null & -w /some/dir   (rc=127)
# tilix 는 -w/-e 같은 옵션을 받으므로 "$@" 로 넘긴다.
#
# 함수를 넣기 전에 예전 alias 줄을 지워야 한다. bash 는 alias 를 함수보다 먼저
# 전개하므로 둘 다 남아 있으면 alias 가 함수를 가려 버린다.
- name: Remove the old tilix alias superseded by the shell function
  lineinfile:
    path: "{{ user_home_dir }}/.bashrc"
    regexp: '^alias tilix='
    state: absent
  when: is_wsl | bool

- name: Add a tilix shell function for WSL2
  lineinfile:
    path: "{{ user_home_dir }}/.bashrc"
    regexp: '^tilix\(\)'
    line: 'tilix() { GDK_BACKEND=wayland /usr/bin/tilix "$@" &> /dev/null & }'
  when: is_wsl | bool