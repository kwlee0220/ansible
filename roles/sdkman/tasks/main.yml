- name: Ensure required dependencies are installed
  become: true
  apt:
    name:
      - curl
      - unzip
    state: present

- name: Check if SDKMAN is already installed
  stat:
    path: "{{ user_home_dir }}/.sdkman/bin/sdkman-init.sh"
  register: sdkman_installed

- name: Instance SDKMAN if not installed
  include_tasks: task_install_sdkman.yml
  when: not sdkman_installed.stat.exists

# Candidate installs run on every play (not only on fresh SDKMAN installs)
# so that requested java/gradle versions are applied to existing SDKMAN setups too.
- name: Install Java Temurin {{ sdkman_java_version }} using SDKMAN
  shell: |
    source {{ user_home_dir }}/.sdkman/bin/sdkman-init.sh && sdk install java {{ sdkman_java_version }}
  args:
    executable: /bin/bash
  environment:
    SDKMAN_DIR: "{{ user_home_dir }}/.sdkman"
  when: sdkman_java_version | default('') != ''

- name: Install Gradle {{ sdkman_gradle_version }} using SDKMAN
  shell: |
    source {{ user_home_dir }}/.sdkman/bin/sdkman-init.sh && sdk install gradle {{ sdkman_gradle_version }}
  args:
    executable: /bin/bash
  environment:
    SDKMAN_DIR: "{{ user_home_dir }}/.sdkman"
  when: sdkman_gradle_version | default('') != ''

