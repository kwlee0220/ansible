
- name: 주요 모듈들 설치
  package:
    name:
      - git
      - dos2unix
      - tree
      - zip
      - unzip
      - build-essential
      - ripgrep
      - tldr
      - btop
      - fastfetch
      - cpufetch
      - net-tools
      - ffmpeg
      - bat
      - fd-find
      - jq
    state: latest
  become: true

- name: Install autojump & configure autojump
  block:
    - name: Install autojump
      package: name=autojump state=latest
      become: true
    - name: Configure autojump
      lineinfile:
          path: "{{ user_home_dir }}/.bashrc"
          regexp: 'source /usr/share/autojump/autojump.sh'
          line: "[[ -s /usr/share/autojump/autojump.sh ]] && source /usr/share/autojump/autojump.sh"
          state: present
    - name: Normalize .bashrc line endings
      command: "dos2unix {{ user_home_dir }}/.bashrc"
      register: dos2unix_result
      changed_when: "'converting file' in dos2unix_result.stderr"

- name: Install gdu application
  block:
    - name: Download gdu binary
      get_url:
        url: "https://github.com/dundee/gdu/releases/latest/download/gdu_linux_amd64.tgz"
        dest: "/tmp/gdu_linux_amd64.tgz"
    - name: Extract gdu binary
      unarchive:
        src: "/tmp/gdu_linux_amd64.tgz"
        dest: "/usr/local/bin/"
        remote_src: yes
    - name: Install extracted binary as 'gdu'
      copy:
        src: "/usr/local/bin/gdu_linux_amd64"
        dest: "/usr/local/bin/gdu"
        mode: '0755'
        remote_src: yes
  rescue:
    - name: Warn that gdu installation was skipped
      debug:
        msg: "gdu installation failed; continuing without it (non-fatal)."
  become: true

- name: Install fzf application
  include_role: name=fzf

- name: Install vim
  include_role: name=vim