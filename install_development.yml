---
- name: install desktop package
  hosts: all

  vars:
    user_id: "{{ ansible_user_id }}"

    sdkman_java_version: "21.0.12-tem"
    # sdkman_gradle_version: "8.9"
    sdkman_gradle_version: "9.6.1"

  roles:
    # - role: temurin_jdk

    # eclipse 는 GUI IDE 라 vscode/dbeaver 와 같은 기준으로 WSL 에서는 제외한다.
    - role: eclipse
      when: not (is_wsl | bool)

    - role: uv

    - role: vscode
      when: not (is_wsl | bool)

    - role: dbeaver
      when: not (is_wsl | bool)

    - role: docker

    # WSL 에서는 portainer 를 올리지 않는다.
    - role: portainer
      when: not (is_wsl | bool)
      vars:
        portainer_additional_ports:
          - "9000:9000"

    - role: sdkman
