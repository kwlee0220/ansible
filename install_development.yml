---
- name: install desktop package
  hosts: all

  vars:
    user_id: "{{ ansible_user_id }}"

    sdkman_java_version: "21.0.12-tem"
    # sdkman_gradle_version: "8.9"
    sdkman_gradle_version: "9.6.1"

  roles:
    # - role: temurin_jdk

    # eclipse 는 WSL 에서도 설치한다. WSLg 로 창이 뜨고, 이 role 은 사용자 홈에
    # 풀어 넣는 user-local 설치라 데스크톱 세션에 의존하지 않는다.
    - role: eclipse

    - role: uv

    - role: vscode
      when: not (is_wsl | bool)

    - role: dbeaver
      when: not (is_wsl | bool)

    - role: docker

    # WSL 에서는 portainer 를 올리지 않는다.
    - role: portainer
      when: not (is_wsl | bool)
      vars:
        portainer_additional_ports:
          - "9000:9000"

    - role: sdkman
