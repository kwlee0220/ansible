---
- name: install desktop package
  hosts: all

  vars:
    user_id: "{{ ansible_user_id }}"

    sdkman_java_version: "21.0.12-tem"
    # sdkman_gradle_version: "8.9"
    sdkman_gradle_version: "9.6.1"

  roles:
    # - role: temurin_jdk

    - role: eclipse

    - role: uv

    - role: vscode
      when: not (is_wsl | bool)

    - role: dbeaver
      when: not (is_wsl | bool)

    - role: docker

    - role: portainer
      vars:
        portainer_additional_ports:
          - "9000:9000"

    - role: sdkman
