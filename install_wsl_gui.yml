---
# =============================================================================
# WSL 타깃용 GUI 관련 설치
# -----------------------------------------------------------------------------
# install_gui.yml 은 GNOME 데스크톱 세션이 있는 호스트를 전제한다. WSL 에서는
# WSLg 가 개별 GUI 앱만 띄우고 GNOME Shell 이 없어서 그 playbook 의 대부분이
# 의미가 없고, 마지막 gsettings 태스크는 org.gnome.shell / dash-to-dock 스키마가
# 없어 "No such schema" 로 실제로 실패한다.
#
# 그래서 WSL 에서 의미가 남는 것만 따로 모은다:
#   tilix    WSLg 에서 동작하는 터미널. role 에 WSL 분기(vte.sh, alias)가 있다.
#   hangul   locale / language-pack-ko / 한글 폰트. WSL 분기에서 fcitx5 를 깐다.
#   pcmanfm  WSLg 로 뜨는 가벼운 파일 관리자. nautilus 없이 쓸 수 있다.
#
# install_gui.yml 에서 가져오지 않은 것과 이유:
#   xrdp             내보낼 데스크톱 세션이 없다. mirrored 네트워킹에서는 3389 가
#                    Windows RDP 와 겹치기도 한다.
#   google-chrome    Windows 쪽 브라우저를 쓴다 (install_gui.yml 도 WSL 은 제외).
#   nautilus-share   nautilus 가 없고, samba 공유도 WSL 에서는 만들지 않는다.
#   gnome-terminal   WSLg 로 뜨긴 하지만 Windows Terminal 과 중복이다.
#   gnome-tweaks     GNOME Shell 설정 도구인데 GNOME Shell 이 없다.
#   dconf-editor
#   gsettings 튜닝   위에 적은 대로 스키마가 없어 실패한다.
#
# 실행:
#   ansible-playbook -i hosts install_wsl_gui.yml --limit wsl2 -K
# =============================================================================

- name: Install GUI packages for WSL
  hosts: all

  vars:
    # .bashrc 경로를 만들 때 쓴다. role 의 defaults 는 그 role 안에서만 보이므로
    # play 의 tasks: 에는 닿지 않는다 (62cad2a 참조).
    user_home_dir: "{{ ansible_env.HOME }}"

    # 한글 입력기(fcitx5)까지 설치할지 여부. WSLg 로 리눅스 GUI 앱을 쓰지 않으면
    # false 로 둘 수 있으나, locale 과 한글 폰트 설정도 이 role 이 함께 한다.
    install_hangul: true

  pre_tasks:
    - name: Assert that the target is WSL
      ansible.builtin.assert:
        that:
          - is_wsl | bool
        fail_msg: >-
          이 playbook 은 WSL 타깃 전용입니다.
          현재 타깃의 커널은 '{{ ansible_kernel }}' 입니다.
          데스크톱 호스트에는 install_gui.yml 을 사용하세요.
        quiet: true

    # tilix role 의 dconf 태스크는 community.general.dconf 를 쓰는데, 이 모듈은
    # 타깃에 psutil 을 요구한다. 없으면 "Failed to import the required Python
    # library (psutil)" 로 실패한다. install_gui.yml 이 같은 이유로 깔던 것이다.
    # (dconf-cli / dconf-editor / dbus-x11 은 tilix role 이 직접 설치한다)
    - name: Install psutil for the dconf module
      ansible.builtin.apt:
        name: python3-psutil
        state: present
        update_cache: true
      become: true

    # tilix 를 Wayland 로 띄우면(tilix role 의 alias 참조) fcitx5 한글 입력이 GTK 의
    # DBus 프론트엔드를 타므로 세션 D-Bus 버스가 반드시 있어야 한다. X11 경로에서는
    # XIM 으로 우회되어 버스 없이도 되던 탓에 이 문제가 오래 가려져 있었다.
    #
    # 버스는 dbus-user-session 이 systemd --user 의 dbus.socket 으로 만들어 준다.
    # 그런데 이 패키지가 systemd --user 가 이미 뜬 뒤에 설치되면 (다른 playbook 이
    # docker-ce 를 깔면서 딸려오는 식으로) 그 부팅 동안 소켓이 올라오지 않아
    # /run/user/<uid>/bus 가 없는 채로 남는다. 그래서 설치만 하지 말고 현재 세션에서도
    # 살려 준다. dconf load 태스크도 이 버스가 있어야 제대로 된 경로를 탄다.
    - name: Install dbus-user-session
      ansible.builtin.package:
        name: dbus-user-session
        state: present
      become: true

    # 아래 두 태스크는 systemd 가 있는 WSL 에서만 의미가 있다. /etc/wsl.conf 에
    # systemd=true 가 없으면 systemd --user 자체가 없어서 세션 버스를 만들 방법이
    # 없다. 그 경우는 마지막 태스크가 경고만 남긴다.
    - name: Check whether the user D-Bus socket is running
      ansible.builtin.command: systemctl --user is-active dbus.socket
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
      register: dbus_socket_state
      changed_when: false
      failed_when: false
      when: ansible_service_mgr == 'systemd'

    - name: Start the user D-Bus socket in the current session
      ansible.builtin.shell: |
        systemctl --user daemon-reload
        systemctl --user start dbus.socket
      args:
        executable: /bin/bash
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
      when:
        - ansible_service_mgr == 'systemd'
        - dbus_socket_state.stdout | default('') != 'active'

    - name: Warn when there is no systemd to provide the session D-Bus bus
      ansible.builtin.debug:
        msg: >-
          systemd 가 없어 세션 D-Bus 버스를 만들 수 없습니다.
          Wayland 로 띄운 tilix 에서 fcitx5 한글 입력이 동작하지 않습니다.
          /etc/wsl.conf 에 [boot] systemd=true 를 넣고 wsl --shutdown 후 다시 실행하세요.
      when: ansible_service_mgr != 'systemd'

  roles:
    - name: Install Tilix
      role: tilix

    - name: Install Hangul input
      role: hangul
      when: install_hangul | bool

  tasks:
    - name: Install PCManFM
      ansible.builtin.package:
        name:
          - pcmanfm
        state: present
      become: true

    # tilix 와 마찬가지로 터미널을 붙잡지 않고 뜨게 한다. GDK_BACKEND=wayland 인
    # 이유는 tilix role 의 셸 함수 주석 참조 (Xwayland 로 띄우면 마우스 포인터가
    # 보이지 않고 창 크기도 바뀌지 않는다. GTK 앱 전반에 해당한다).
    #
    # tilix 처럼 alias 로 두지 않고 셸 함수로 두는 이유는 인자 때문이다. alias 는
    # 뒤에 붙는 인자가 '&' 다음으로 밀려 별도 명령으로 실행되어 버린다.
    #   alias pcmanfm="... &> /dev/null &" 일 때
    #   $ pcmanfm /some/dir  ->  ... &> /dev/null & /some/dir   (rc=127)
    # 파일 관리자는 'pcmanfm .' 처럼 경로를 받는 일이 흔하므로 "$@" 로 넘긴다.
    - name: Add a pcmanfm shell function that backgrounds it and drops its output
      ansible.builtin.lineinfile:
        path: "{{ user_home_dir }}/.bashrc"
        regexp: '^pcmanfm\(\)'
        line: 'pcmanfm() { GDK_BACKEND=wayland /usr/bin/pcmanfm "$@" &> /dev/null & }'

    # gedit 는 가능하면 snap 으로 설치한다. 22.04 저장소의 deb 는 41.0 에서 멈춰
    # 있고 snap 쪽은 48.x 를 따라간다.
    #
    # 다만 snap 경로에는 조건이 둘 있고, 두 번째가 WSL 에서 자주 걸린다.
    #
    #  1) snapd 는 systemd 아래에서 돌아야 한다. /etc/wsl.conf 에 systemd=true
    #     가 없는 WSL 에서는 snapd 자체를 띄울 수 없다.
    #  2) gedit 는 strict confinement 스냅이고, 의존 스냅인 mesa-2404 도 그렇다.
    #     WSL2 커널에는 AppArmor 가 없어서(/sys/module/apparmor/parameters/enabled
    #     가 N) snapd 가 confinement 를 'partial' 로 잡고, 이때
    #     'snap debug sandbox-features' 의 confinement-options 에서 strict 가
    #     빠진다. 이 상태로 설치를 걸면 다운로드는 다 받은 뒤 hook 실행 단계에서
    #       cannot preserve mount namespace of process N as mesa-2404.mnt:
    #       Invalid argument
    #     로 죽고 전체가 롤백된다. 실패까지 3분쯤 걸리므로 시도 자체를 막는다.
    #
    # 두 조건 중 하나라도 어긋나면 deb 로 떨어진다.
    - name: Install snapd
      ansible.builtin.package:
        name: snapd
        state: present
      become: true
      when: ansible_service_mgr == 'systemd'

    - name: Ensure snapd is running
      ansible.builtin.systemd:
        name: snapd.socket
        state: started
        enabled: true
      become: true
      when: ansible_service_mgr == 'systemd'

    # 갓 설치한 snapd 는 seeding 이 끝나기 전까지 "too early for operation,
    # device not yet seeded" 로 설치를 거부한다. 그래서 씨딩을 기다린다.
    - name: Wait for snapd to finish seeding
      ansible.builtin.command: snap wait system seed.loaded
      become: true
      changed_when: false
      when: ansible_service_mgr == 'systemd'

    # strict 스냅을 설치할 수 있는 시스템인지 미리 본다. 정상 시스템은 'strict',
    # AppArmor 가 없는 WSL2 는 'partial' 을 뱉는다. snapd 가 없거나 명령이
    # 실패해도 (rc != 0) stdout 이 비어 아래 조건이 거짓이 되므로 deb 로 간다.
    - name: Check whether snapd supports strict confinement
      ansible.builtin.command: snap debug confinement
      register: snap_confinement
      changed_when: false
      failed_when: false
      become: true
      when: ansible_service_mgr == 'systemd'

    - name: Select the gedit install method
      ansible.builtin.set_fact:
        gedit_use_snap: "{{ (snap_confinement.stdout | default('') | trim) == 'strict' }}"

    - name: Report that gedit falls back to the distribution package
      ansible.builtin.debug:
        msg: >-
          snap 이 strict confinement 를 지원하지 않아
          (confinement={{ snap_confinement.stdout | default('n/a') | trim }})
          gedit 를 저장소 deb 로 설치합니다. snap 쪽보다 버전이 낮습니다.
      when: not (gedit_use_snap | bool)

    - name: Install gedit (snap)
      community.general.snap:
        name: gedit
        state: present
      become: true
      when: gedit_use_snap | bool

    - name: Install gedit (deb, snap 을 쓸 수 없을 때)
      ansible.builtin.package:
        name: gedit
        state: present
      become: true
      when: not (gedit_use_snap | bool)
